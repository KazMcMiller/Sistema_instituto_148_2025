<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Mesa - Instituto 148</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .container {
            margin-top: 20px;
        }
    </style>
</head>
<body style="padding-left:250px">
    {% include 'navbar.html' %}
    <div class="container">
        <h2>Crear Mesa de Examen</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('crear_mesa') }}">
            <div class="form-group">
                <label for="id_materia">Materia</label>
                <select class="form-control" id="id_materia" name="id_materia" required>
                    <option value="">Selecciona una materia</option>
                    {% for materia in materias %}
                        <option value="{{ materia[0] }}">{{ materia[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="fecha_examen">Fecha de Examen</label>
                <input type="datetime-local" class="form-control" id="fecha_examen" name="fecha_examen" required>
            </div>
            <div class="form-group">
                <label for="fecha_apertura">Fecha de Apertura</label>
                <input type="datetime-local" class="form-control" id="fecha_apertura" name="fecha_apertura" required>
            </div>
            <div class="form-group">
                <label for="fecha_cierre">Fecha de Cierre</label>
                <input type="datetime-local" class="form-control" id="fecha_cierre" name="fecha_cierre" required>
            </div>
            <div class="form-group">
                <label for="dni_profesor">Profesor Titular</label>
                <select class="form-control" id="dni_profesor" name="dni_profesor" required>
                    <option value="">Selecciona un profesor</option>
                    {% for profesor in profesores %}
                        <option value="{{ profesor[0] }}">{{ profesor[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="dni_suplente">Profesor Suplente (Opcional)</label>
                <select class="form-control" id="dni_suplente" name="dni_suplente">
                    <option value="">Ninguno</option>
                    {% for profesor in profesores %}
                        <option value="{{ profesor[0] }}">{{ profesor[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Crear Mesa</button>
            <a href="{{ url_for('listar_mesas') }}" class="btn btn-secondary">Volver</a>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
