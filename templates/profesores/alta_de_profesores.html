<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Profesores - Instituto 148</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body style="padding-left:250px">
    {% include 'navbar.html' %}
    <div class="container">
        <h2>Alta de Profesores</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('alta_profesores') }}" id="altaForm">
            <h4>Datos Personales</h4>
            <div class="form-group">
                <label for="nombre">Nombres</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="apellido">Apellidos</label>
                <input type="text" class="form-control" id="apellido" name="apellido" required>
            </div>
            <div class="form-group">
                <label for="dni_profesor">DNI</label>
                <div class="input-group">
                    <input type="number" class="form-control" id="dni_profesor" name="dni_profesor" required min="1000000" max="99999999" minlength="7" maxlength="8">
                    <button type="button" class="btn btn-primary btn-sm ml-2" id="checkDniBtn">Comprobar DNI</button>
                </div>
                <div id="dniMessage" style="margin-top: 5px;"></div>
            </div>
            <div class="form-group">
                <label for="sexo">Sexo</label>
                <select class="form-control" id="sexo" name="sexo" required>
                    <option value="">Seleccione</option>
                    {% for sexo in sexos %}
                        <option value="{{ sexo.descripcion }}">{{ sexo.descripcion }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="domicilio">Domicilio</label>
                <input type="text" class="form-control" id="domicilio" name="domicilio">
            </div>
            <div class="form-group">
                <label for="piso">Piso</label>
                <input type="number" class="form-control" id="piso" name="piso" min="0">
            </div>
            <div class="form-group">
                <label for="dpto">Departamento</label>
                <input type="text" class="form-control" id="dpto" name="dpto">
            </div>
            <div class="form-group">
                <label for="localidad">Localidad</label>
                <input type="text" class="form-control" id="localidad" name="localidad">
            </div>
            <div class="form-group">
                <label for="partido">Partido</label>
                <input type="text" class="form-control" id="partido" name="partido">
            </div>
            <div class="form-group">
                <label for="codigo_postal">Código Postal</label>
                <input type="number" class="form-control" id="codigo_postal" name="codigo_postal">
            </div>
            <div class="form-group">
                <label for="pais">País</label>
                <select class="form-control" id="pais" name="pais" required>
                    <option value="">Seleccione un país</option>
                    {% for p in paises %}
                        <option value="{{ p.nombre }}">{{ p.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            </div>
            <div class="form-group">
                <label for="celular">Celular</label>
                <input type="text" class="form-control" id="celular" name="celular" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento">
            </div>
            <div class="form-group">
                <label for="lugar_nacimiento">Lugar de Nacimiento</label>
                <input type="text" class="form-control" id="lugar_nacimiento" name="lugar_nacimiento">
            </div>

            <h4>Documentación</h4>
            <div class="form-group">
                <label for="foja">Foja</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="foja" name="foja">
                    <button type="button" class="btn btn-primary btn-sm ml-2" id="checkFojaBtn">Comprobar Foja</button>
                </div>
                <div id="fojaMessage" style="margin-top: 5px;"></div>
            </div>
            <div class="form-group">
                <label for="n_registro">N° de Registro</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="n_registro" name="n_registro">
                    <button type="button" class="btn btn-primary btn-sm ml-2" id="checkRegistroBtn">Comprobar Registro</button>
                </div>
                <div id="registroMessage" style="margin-top: 5px;"></div>
            </div>
            <div class="form-group">
                <label for="certificado_aptitud_fisica">Certificado de Aptitud Física</label>
                <input type="checkbox" id="certificado_aptitud_fisica" name="certificado_aptitud_fisica" value="1">
            </div>

            <h4>Títulos</h4>
            <div id="titulos">
                <div class="titulo-group">
                    <div class="form-group">
                        <label for="titulo_1">Título</label>
                        <input type="text" class="form-control" id="titulo_1" name="titulo[]">
                    </div>
                    <div class="form-group">
                        <label for="expedido_por_1">Expedido Por</label>
                        <input type="text" class="form-control" id="expedido_por_1" name="expedido_por[]">
                    </div>
                    <div class="form-group">
                        <label for="duracion_1">Duración</label>
                        <input type="number" class="form-control" id="duracion_1" name="duracion[]" min="0">
                    </div>
                    <div class="form-group">
                        <label for="finalizo_1">Finalizó</label>
                        <input type="checkbox" id="finalizo_1" name="finalizo[]" value="1">
                    </div>
                    <div class="form-group">
                        <label for="fecha_egreso_1">Fecha de Egreso</label>
                        <input type="date" class="form-control" id="fecha_egreso_1" name="fecha_egreso[]">
                    </div>
                    <div class="form-group">
                        <label for="porcentaje_carrera_1">Porcentaje de la Carrera</label>
                        <input type="number" class="form-control" id="porcentaje_carrera_1" name="porcentaje_carrera[]" min="0" max="100">
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-primary" id="agregarTitulo">Agregar Título</button>
            <button type="submit" class="btn btn-info" id="submitBtn">Registrar</button>
            <a href="{{ url_for('profesores') }}" class="btn btn-secondary">Volver</a>
        </form>
    </div>

    <script>
        // Set max date for fecha_nacimiento (21 years ago from today)
        function setMaxBirthDate() {
            const today = new Date();
            const maxDate = new Date(today.getFullYear() - 21, today.getMonth(), today.getDate());
            const maxDateString = maxDate.toISOString().split('T')[0];
            document.getElementById('fecha_nacimiento').setAttribute('max', maxDateString);
        }
        setMaxBirthDate();

        // Check DNI
        function checkDNI(dni, messageDiv) {
            messageDiv.style.display = 'none';
            messageDiv.textContent = '';
            messageDiv.style.color = '';

            if (dni) {
                fetch('{{ url_for("check_dni") }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `dni_profesor=${encodeURIComponent(dni)}`
                })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok: ' + response.status);
                    return response.json();
                })
                .then(data => {
                    messageDiv.style.display = 'block';
                    if (data.exists) {
                        messageDiv.textContent = 'Este DNI ya existe en el sistema';
                        messageDiv.style.color = 'red';
                    } else {
                        messageDiv.textContent = 'DNI disponible';
                        messageDiv.style.color = 'green';
                    }
                })
                .catch(error => {
                    console.error('Error checking DNI:', error);
                    messageDiv.style.display = 'block';
                    messageDiv.textContent = 'Error al verificar DNI';
                    messageDiv.style.color = 'red';
                });
            } else {
                messageDiv.style.display = 'block';
                messageDiv.textContent = 'Por favor, ingrese un DNI';
                messageDiv.style.color = 'red';
            }
        }

        // Validate DNI on button click
        document.getElementById('checkDniBtn').addEventListener('click', function() {
            const dni = document.getElementById('dni_profesor').value || '';
            const messageDiv = document.getElementById('dniMessage');
            checkDNI(dni, messageDiv);
        });

        // Prevent submission if DNI exists
        document.getElementById('altaForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent form submission until validation
            const dni = document.getElementById('dni_profesor').value || '';
            const messageDiv = document.getElementById('dniMessage');

            if (dni) {
                fetch('{{ url_for("check_dni") }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `dni_profesor=${encodeURIComponent(dni)}`
                })
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok: ' + response.status);
                    return response.json();
                })
                .then(data => {
                    messageDiv.style.display = 'block';
                    if (data.exists) {
                        messageDiv.textContent = 'Este DNI ya existe en el sistema';
                        messageDiv.style.color = 'red';
                    } else {
                        messageDiv.textContent = 'DNI disponible';
                        messageDiv.style.color = 'green';
                        this.submit(); // Proceed with form submission
                    }
                })
                .catch(error => {
                    console.error('Error checking DNI:', error);
                    messageDiv.style.display = 'block';
                    messageDiv.textContent = 'Error al verificar DNI';
                    messageDiv.style.color = 'red';
                });
            } else {
                messageDiv.style.display = 'block';
                messageDiv.textContent = 'Por favor, ingrese un DNI';
                messageDiv.style.color = 'red';
            }
        });

        // Agregar título dinámicamente con separador
        let tituloCount = 1;
        document.getElementById('agregarTitulo').addEventListener('click', function() {
            tituloCount++;
            const div = document.createElement('div');
            div.className = 'titulo-group';
            div.innerHTML = `
                <hr>
                <div class="form-group">
                    <label for="titulo_${tituloCount}">Título</label>
                    <input type="text" class="form-control" id="titulo_${tituloCount}" name="titulo[]">
                </div>
                <div class="form-group">
                    <label for="expedido_por_${tituloCount}">Expedido Por</label>
                    <input type="text" class="form-control" id="expedido_por_${tituloCount}" name="expedido_por[]">
                </div>
                <div class="form-group">
                    <label for="duracion_${tituloCount}">Duración</label>
                    <input type="number" class="form-control" id="duracion_${tituloCount}" name="duracion[]" min="0">
                </div>
                <div class="form-group">
                    <label for="finalizo_${tituloCount}">Finalizó</label>
                    <input type="checkbox" id="finalizo_${tituloCount}" name="finalizo[]" value="1">
                </div>
                <div class="form-group">
                    <label for="fecha_egreso_${tituloCount}">Fecha de Egreso</label>
                    <input type="date" class="form-control" id="fecha_egreso_${tituloCount}" name="fecha_egreso[]">
                </div>
                <div class="form-group">
                    <label for="porcentaje_carrera_${tituloCount}">Porcentaje de la Carrera</label>
                    <input type="number" class="form-control" id="porcentaje_carrera_${tituloCount}" name="porcentaje_carrera[]" min="0" max="100">
                </div>
                <button type="button" class="btn btn-danger btn-sm quitarTitulo">Quitar Título</button>
            `;
            document.getElementById('titulos').appendChild(div);
        });

        // Quitar título dinámicamente
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('quitarTitulo')) {
                e.target.closest('.titulo-group').remove();
            }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(document).ready(function() {
            // === COMPROBAR FOJA (solo foja) ===
            $('#checkFojaBtn').click(function() {
                const foja = $('#foja').val().trim();
                if (!foja) {
                    $('#fojaMessage').html('<small class="text-danger">Ingrese una Foja</small>');
                    return;
                }
                $.post("{{ url_for('check_foja') }}", { foja: foja })
                    .done(function(res) {
                        if (res.exists) {
                            $('#fojaMessage').html('<small class="text-danger">Foja ya existe en otro profesor</small>');
                        } else {
                            $('#fojaMessage').html('<small class="text-success">Foja disponible</small>');
                        }
                    })
                    .fail(function() {
                        $('#fojaMessage').html('<small class="text-danger">Error de conexión</small>');
                    });
            });

            // === COMPROBAR N° REGISTRO (solo registro) ===
            $('#checkRegistroBtn').click(function() {
                const registro = $('#n_registro').val().trim();
                if (!registro) {
                    $('#registroMessage').html('<small class="text-danger">Ingrese un N° de Registro</small>');
                    return;
                }
                $.post("{{ url_for('check_registro') }}", { n_registro: registro })
                    .done(function(res) {
                        if (res.exists) {
                            $('#registroMessage').html('<small class="text-danger">N° Registro ya existe en otro profesor</small>');
                        } else {
                            $('#registroMessage').html('<small class="text-success">N° Registro disponible</small>');
                        }
                    })
                    .fail(function() {
                        $('#registroMessage').html('<small class="text-danger">Error de conexión</small>');
                    });
            });
        });
    </script>
</body>
</html>
