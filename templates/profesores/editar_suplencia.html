<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Suplencia - Instituto 148</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body style="padding-left:250px">
    {% include 'navbar.html' %}
    <div class="container">
        <h2>Editar Suplencia</h2>
        <p>Instituto Superior de Formación Docente y/o Técnica</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('editar_suplencia', id_suplencia=suplencia.id_suplencia) }}">
            <!-- PROFESOR -->
            <div class="form-group">
                <label for="dni_profesor">Profesor</label>
                <select class="form-control" id="dni_profesor" name="dni_profesor" required>
                    <option value="">Seleccione un profesor</option>
                    {% for profesor in profesores %}
                        <option value="{{ profesor[0] }}" {% if profesor[0] == suplencia.dni_profesor %}selected{% endif %}>
                            {{ profesor[0] }} - {{ profesor[1] }} {{ profesor[2] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- SUPLENTE -->
            <div class="form-group">
                <label for="dni_suplente">Suplente</label>
                <select class="form-control" id="dni_suplente" name="dni_suplente">
                    <option value="">Seleccione un suplente (opcional)</option>
                    {% for profesor in profesores %}
                        <option value="{{ profesor[0] }}" {% if profesor[0] == suplencia.dni_suplente %}selected{% endif %}>
                            {{ profesor[0] }} - {{ profesor[1] }} {{ profesor[2] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- FECHA SOLICITUD -->
            <div class="form-group">
                <label for="fecha">Fecha de Solicitud</label>
                <input type="date" class="form-control" id="fecha" name="fecha" value="{{ suplencia.fecha }}" required>
            </div>

            <!-- CARRERA -->
            <div class="form-group">
                <label for="id_carrera">Carrera</label>
                <select class="form-control" id="id_carrera" name="id_carrera" required>
                    <option value="">Seleccione una carrera</option>
                    {% for carrera in carreras %}
                        <option value="{{ carrera[0] }}" {% if carrera[0] == suplencia.id_carrera %}selected{% endif %}>
                            {{ carrera[1] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- MATERIA -->
            <div class="form-group">
                <label for="id_materia">Materia</label>
                <select class="form-control" id="id_materia" name="id_materia" required>
                    <option value="">Seleccione una materia</option>
                    {% for materia in materias %}
                        <option value="{{ materia[0] }}" data-carrera="{{ materia[2] }}" {% if materia[0] == suplencia.id_materia %}selected{% endif %}>
                            {{ materia[1] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- MÓDULOS -->
            <div class="form-group">
                <label for="modulos">Módulos</label>
                <input type="number" class="form-control" id="modulos" name="modulos" min="0" value="{{ suplencia.modulos }}" required>
            </div>

            <!-- FECHAS -->
            <div class="form-group">
                <label for="fecha_desde">Desde</label>
                <input type="date" class="form-control" id="fecha_desde" name="fecha_desde" value="{{ suplencia.fecha_desde }}" required>
            </div>
            <div class="form-group">
                <label for="fecha_hasta">Hasta</label>
                <input type="date" class="form-control" id="fecha_hasta" name="fecha_hasta" value="{{ suplencia.fecha_hasta }}" required>
            </div>

            <!-- OBSERVACIONES -->
            <div class="form-group">
                <label for="observaciones">Observaciones</label>
                <textarea class="form-control" id="observaciones" name="observaciones" rows="4" placeholder="Ingrese observaciones">{{ suplencia.observaciones or '' }}</textarea>
            </div>

            <!-- BOTONES -->
            <button type="submit" class="btn btn-primary">Actualizar</button>
            <a href="{{ url_for('listado_suplencias') }}" class="btn btn-secondary">Volver</a>
        </form>
    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        $(document).ready(function() {
            // Filtrar materias por carrera
            function filtrarMaterias() {
                const selectedCarrera = $('#id_carrera').val();
                const selectedMateria = $('#id_materia').val();

                $('#id_materia option').each(function() {
                    const carreraId = $(this).data('carrera');
                    if (!selectedCarrera || carreraId == selectedCarrera) {
                        $(this).show();
                    } else {
                        $(this).hide();
                    }
                });

                // Si la materia actual no pertenece a la carrera seleccionada, limpiar
                if (selectedMateria) {
                    const materiaCarrera = $('#id_materia option[value="' + selectedMateria + '"]').data('carrera');
                    if (materiaCarrera != selectedCarrera) {
                        $('#id_materia').val('');
                    }
                }
            }

            $('#id_carrera').change(filtrarMaterias);
            filtrarMaterias(); // Ejecutar al cargar
        });
    </script>
</body>
</html>
