<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Inasistencias - Instituto Superior de Formación Docente y/o Técnica</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body style="padding-left:250px">
    {% include 'navbar.html' %}
    <div class="container">
        <h2>Lista de Inasistencias</h2>
        <p>Instituto Superior de Formación Docente y/o Técnica</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('agregar_inasistencia') }}">
            <div class="form-group">
                <label for="dni_profesor">Profesor</label>
                <select class="form-control" id="dni_profesor" name="dni_profesor" required>
                    <option value="">Selecciona un profesor</option>
                    {% for profesor in profesores %}
                    <option value="{{ profesor[0] }}">{{ profesor[1] }} {{ profesor[2] }} (DNI: {{ profesor[0] }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="date" class="form-control" id="fecha" name="fecha" required>
            </div>
            <div class="form-group">
                <label for="motivo">Motivo</label>
                <select class="form-control" id="motivo" name="motivo" required>
                    <option value="">Seleccione una opción</option>
                    <option value="Licencia Administrativa">Licencia Administrativa</option>
                    <option value="Licencia Médica">Licencia Médica</option>
                    <option value="Presente">Presente</option>
                    <option value="Ausente">Ausente</option>
                </select>
            </div>
            <div class="form-group">
                <label for="carrera">Carrera</label>
                <select class="form-control" id="carrera" name="carrera">
                    <option value="">Seleccione una carrera</option>
                    <option value="Análisis de Sistemas">Análisis de Sistemas</option>
                    <option value="Biología">Biología</option>
                    <option value="Producción Agrícola Ganadera">Producción Agrícola Ganadera</option>
                    <option value="Economía">Economía</option>
                    <option value="Lengua">Lengua</option>
                    <option value="Matemáticas">Matemáticas</option>
                    <option value="Geografía">Geografía</option>
                    <option value="Historia">Historia</option>
                    <option value="Psicología">Psicología</option>
                    <option value="Física">Física</option>
                    <option value="Química">Química</option>
                </select>
            </div>
            <div class="form-group">
                <label for="curso">Curso</label>
                <input type="text" class="form-control" id="curso" name="curso">
            </div>
            <div class="form-group">
                <label for="materia">Materia</label>
                <input type="text" class="form-control" id="materia" name="materia">
            </div>
            <div class="form-group">
                <label for="modulo_hs">Módulo/Horas</label>
                <input type="text" class="form-control" id="modulo_hs" name="modulo_hs">
            </div>
            <div class="form-group">
                <label for="observaciones">Observaciones</label>
                <textarea class="form-control" id="observaciones" name="observaciones" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('profesores') }}" class="btn btn-secondary">Volver</a>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
