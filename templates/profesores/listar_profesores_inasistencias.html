<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Asistencias por Mes - Instituto 148</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2-bootstrap-theme/0.1.0-beta.10/select2-bootstrap.min.css" rel="stylesheet" />
    <style>
        .asistencias { background-color: #d4edda; font-weight: bold; text-align: center; }
        .inasistencias { background-color: #f8d7da; font-weight: bold; text-align: center; }
        .card-header { background-color: #007bff; color: rgb(0, 0, 0); }
    </style>
</head>
<body style="padding-left:250px">
    {% include 'navbar.html' %}
    <div class="container mt-4">
        <h2>Resumen de Asistencias e Inasistencias por Mes</h2>
        <p>Instituto Superior de Formación Docente y/o Técnica</p>

        <!-- FILTROS -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="dni_profesor">Profesor</label>
                            <select class="form-control select2" id="dni_profesor" style="width: 100%;">
                                <option value="">Buscar profesor...</option>
                                {% for profesor in profesores %}
                                    <option value="{{ profesor[0] }}">{{ profesor[0] }} - {{ profesor[1] }} {{ profesor[2] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="mes">Mes</label>
                            <select class="form-control" id="mes">
                                <option value="">Mes</option>
                                <option value="01">Enero</option>
                                <option value="02">Febrero</option>
                                <option value="03">Marzo</option>
                                <option value="04">Abril</option>
                                <option value="05">Mayo</option>
                                <option value="06">Junio</option>
                                <option value="07">Julio</option>
                                <option value="08">Agosto</option>
                                <option value="09">Septiembre</option>
                                <option value="10">Octubre</option>
                                <option value="11">Noviembre</option>
                                <option value="12">Diciembre</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="anio">Año</label>
                            <input type="number" class="form-control" id="anio" placeholder="Ej: 2025" min="2000" step="1">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RESULTADO -->
        <div id="resultado" style="display: none;">
            <div class="card">
                <div class="card-header" id="titulo_resumen"></div>
                <div class="card-body p-0">
                    <table class="table table-bordered mb-0">
                        <thead class="thead-light">
                            <tr>
                                <th>Materia</th>
                                <th>Asistencias</th>
                                <th>Inasistencias</th>
                            </tr>
                        </thead>
                        <tbody id="tabla_resumen"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <a href="{{ url_for('agregar_inasistencia') }}" class="btn btn-secondary mt-3">Volver</a>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#dni_profesor').select2({
                theme: 'bootstrap',
                placeholder: 'Buscar profesor...',
                width: '100%'
            });

            function cargarResumen() {
                var dni = $('#dni_profesor').val();
                var mes = $('#mes').val();
                var anio = $('#anio').val();

                // Validar que estén todos los campos
                if (!dni || !mes || !anio) {
                    $('#resultado').hide();
                    return;
                }

                // Validar que anio sea número
                if (isNaN(anio) || anio.length !== 4) {
                    $('#titulo_resumen').text('Año inválido');
                    $('#tabla_resumen').empty();
                    $('#resultado').show();
                    return;
                }

                $.getJSON("{{ url_for('api_resumen_inasistencias_mes') }}", {
                    dni: dni,
                    mes: mes,
                    anio: anio
                })
                .done(function(data) {
                    if (!data || !data.profesor) {
                        $('#titulo_resumen').text('Sin datos');
                        $('#tabla_resumen').html('<tr><td colspan="3" class="text-center text-muted">No hay registros.</td></tr>');
                        $('#resultado').show();
                        return;
                    }

                    const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
                    $('#titulo_resumen').text(
                        `${data.profesor.nombre} ${data.profesor.apellido} (DNI: ${data.profesor.dni}) - ${meses[parseInt(mes)-1]} ${anio}`
                    );

                    let html = '';
                    if (data.materias.length === 0) {
                        html = '<tr><td colspan="3" class="text-center text-muted">No hay registros este mes.</td></tr>';
                    } else {
                        data.materias.forEach(m => {
                            html += `
                                <tr>
                                    <td><strong>${m.nombre}</strong></td>
                                    <td class="asistencias">${m.asistencias}</td>
                                    <td class="inasistencias">${m.inasistencias}</td>
                                </tr>
                            `;
                        });
                    }
                    $('#tabla_resumen').html(html);
                    $('#resultado').show();
                })
                .fail(function() {
                    $('#titulo_resumen').text('Error al cargar');
                    $('#resultado').show();
                });
            }

            // Cargar al cambiar cualquier campo
            $('#dni_profesor, #mes').on('change', cargarResumen);
            $('#anio').on('input', cargarResumen);  // input para detectar escritura
        });
    </script>
</body>
</html>
