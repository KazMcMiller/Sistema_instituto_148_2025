<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Inscripción - Sistema de Gestión Académica</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
    // Parsear la variable turnos_carreras a JSON
    const turnosCarreras = {{ turnos_carreras | tojson }};
    const carreras = {{ lista_carreras | tojson }};
    
    function updateCarreras() {
        const institucionSelect = document.getElementById('id_institucion');
        const carreraSelect = document.getElementById('carrera');
        const idInstitucion = institucionSelect.value;

        carreraSelect.innerHTML = '<option value="">Seleccione una carrera</option>';

        if (idInstitucion) {
            const carrerasDisponibles = carreras.filter(carrera => carrera.id_institucion == idInstitucion);

            carrerasDisponibles.forEach(carrera => {
                const option = document.createElement('option');
                option.value = carrera.id_carrera;
                option.textContent = carrera.nombre;
                carreraSelect.appendChild(option);
            });
        }
    }

    function updateTurno() {
        const carreraSelect = document.getElementById('carrera');
        const turnoSelect = document.getElementById('turno');
        const idCarrera = carreraSelect.value;

        turnoSelect.innerHTML = '<option value="">Seleccione un turno</option>';

        if (idCarrera) {
            const turnosDisponibles = turnosCarreras.filter(turno => turno.id_carrera == idCarrera);

            if (turnosDisponibles.length == 1) {
                turnoSelect.innerHTML = `<option value="${turnosDisponibles[0].id_turno}" selected>${turnosDisponibles[0].descripcion}</option>`;
                turnoSelect.disabled = false;
            } else if (turnosDisponibles.length > 1) {
                turnosDisponibles.forEach(turno => {
                    const option = document.createElement('option');
                    option.value = turno.id_turno;
                    option.textContent = turno.descripcion;
                    turnoSelect.appendChild(option);
                });
                turnoSelect.disabled = false;
            } else {
                turnoSelect.disabled = true;
            }
        } else {
            turnoSelect.disabled = true;
        }
    }
    </script>
</head>
<body>
    <div class="container mt-3">
        <div class="container rounded-sm" id="cont-insc">
            {% include 'navbar.html' %}
            <div class="form-container">
                <h4 class="text-primary text-center mt-3">Pre-Inscripción</h4>
                <hr>
                <h4 class="text-primary">Datos Personales</h4>
                <form method="POST" action="{{ url_for('pre_inscripcion_2') }}">
                    <div class="form-row">
                        <div class="col col-md-4 form-group">
                            <label for="nombre">Nombres:</label>
                            <input class="form-control form-control-sm" type="text" id="nombre" name="nombre" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="apellido">Apellido:</label>
                            <input class="form-control form-control-sm" type="text" id="apellido" name="apellido" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="id_sexo">Sexo:</label>
                            <select class="form-control form-control-sm" id="id_sexo" name="id_sexo" required>
                                <option value="">Seleccione un sexo</option>
                                {% for sexo in sexos %}
                                    <option value="{{ sexo[0] }}">{{ sexo[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="dni">DNI:</label>
                            <input class="form-control form-control-sm" type="number" id="dni" name="dni" required min="1000000" max="99999999">
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                            <input class="form-control form-control-sm" type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="lugar_nacimiento">Lugar de Nacimiento:</label>
                            <input class="form-control form-control-sm" type="text" id="lugar_nacimiento" name="lugar_nacimiento">
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="id_estado_civil">Estado Civil:</label>
                            <select class="form-control form-control-sm" id="id_estado_civil" name="id_estado_civil" required>
                                <option value="">Seleccione un estado civil</option>
                                {% for estado in estados_civiles %}
                                    <option value="{{ estado[0] }}">{{ estado[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="cantidad_hijos">Cantidad de Hijos:</label>
                            <input class="form-control form-control-sm" type="number" id="cantidad_hijos" name="cantidad_hijos" min="0" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="familiares_a_cargo">Familiares a Cargo:</label>
                            <input class="form-control form-control-sm" type="number" id="familiares_a_cargo" name="familiares_a_cargo" min="0" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="domicilio">Domicilio:</label>
                            <input class="form-control form-control-sm" type="text" id="domicilio" name="domicilio" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="piso">Piso:</label>
                            <input class="form-control form-control-sm" type="text" id="piso" name="piso" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="localidad">Localidad:</label>
                            <input class="form-control form-control-sm" type="text" id="localidad" name="localidad" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="id_pais">País:</label>
                            <select class="form-control form-control-sm" id="id_pais" name="id_pais" required>
                                <option value="">Seleccione un país</option>
                                {% for pais in paises %}
                                    <option value="{{ pais[0] }}">{{ pais[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="id_provincia">Provincia:</label>
                            <select class="form-control form-control-sm" id="id_provincia" name="id_provincia" required>
                                <option value="">Seleccione una provincia</option>
                                {% for provincia in provincias %}
                                    <option value="{{ provincia[0] }}">{{ provincia[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>                        
                        <div class="col col-md-4 form-group">
                            <label for="codigo_postal">Código Postal:</label>
                            <input class="form-control form-control-sm" type="text" id="codigo_postal" name="codigo_postal" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="telefono">Teléfono:</label>
                            <input class="form-control form-control-sm" type="number" id="telefono" name="telefono" required>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="telefono_alt">Teléfono Alternativo:</label>
                            <input class="form-control form-control-sm" type="number" id="telefono_alt" name="telefono_alt">
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="telefono_alt_propietario">Propietario Teléfono Alt.:</label>
                            <input class="form-control form-control-sm" type="text" id="telefono_alt_propietario" name="telefono_alt_propietario">
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="email">Email:</label>
                            <input class="form-control form-control-sm" type="email" id="email" name="email" required>
                        </div>
                    </div>
                    <h4 class="text-primary">Datos Académicos</h4>
                    <div class="form-row">
                        <div class="col col-md-3 form-group">
                            <label for="id_institucion">Institución:</label>
                            <select class="form-control form-control-sm" id="id_institucion" name="id_institucion" onchange="updateCarreras()" required>
                                <option value="">Seleccione una institución</option>
                                {% for instituto in institutos %}
                                    <option value="{{ instituto[0] }}">{{ instituto[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col col-md-3 form-group">
                            <label for="carrera">Carrera:</label>
                            <select class="form-control form-control-sm" id="carrera" name="carrera" onchange="updateTurno()" required>
                                <option value="">Seleccione una carrera</option>
                            </select>
                        </div>                            
                        <div class="form-group">
                            <label for="turno">Turno</label>
                            <select class="form-control form-control-sm" id="turno" name="turno" required>
                                <option value="">Seleccione un turno</option>
                            </select>                    
                        </div>
                    </div>
                    <div class="actions" id="boton-siguiente">
                        <button type="submit" class="float-right mb-3">Siguiente</button>
                    </div>
                </form>
                <div class="action" id="boton-atras">
                    <form method="GET" action="{{ url_for('home') }}">
                        <button type="submit" class="float-left mb-3">Atrás</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="bootstrap.bundle.min.js"></script>
</body>
</html>
