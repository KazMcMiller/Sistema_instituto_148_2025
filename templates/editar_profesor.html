<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Profesor - Instituto 148</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container">
        <h2>Editar Profesor</h2>
        <p>Instituto Superior de Formación Docente y/o Técnica</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('editar_profesor', dni_profesor=profesor[0]) }}">
            <div class="form-group">
                <label for="dni_profesor">DNI</label>
                <input type="text" class="form-control" id="dni_profesor" value="{{ profesor[0] }}" disabled>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" value="{{ profesor[1] }}" required>
            </div>
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" class="form-control" id="apellido" name="apellido" value="{{ profesor[2] }}" required>
            </div>
            <div class="form-group">
                <label for="partido">Ciudad</label>
                <input type="text" class="form-control" id="partido" name="partido" value="{{ profesor[3] or '' }}">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono" value="{{ profesor[4] }}" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ profesor[5] }}" required>
            </div>
            <div class="form-group">
                <label for="celular">Celular</label>
                <input type="text" class="form-control" id="celular" name="celular" value="{{ profesor[6] or '' }}">
            </div>
            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ profesor[7] or '' }}">
            </div>
            <div class="form-group">
                <label for="lugar_nacimiento">Lugar de Nacimiento</label>
                <input type="text" class="form-control" id="lugar_nacimiento" name="lugar_nacimiento" value="{{ profesor[8] or '' }}">
            </div>
            <div class="form-group">
                <label for="pais">País</label>
                <input type="text" class="form-control" id="pais" name="pais" value="{{ profesor[9] or '' }}">
            </div>
            <div class="form-group">
                <label for="foja">Foja</label>
                <input type="text" class="form-control" id="foja" name="foja" value="{{ profesor[10] or '' }}">
            </div>
            <div class="form-group">
                <label for="n_registro">N° Registro</label>
                <input type="text" class="form-control" id="n_registro" name="n_registro" value="{{ profesor[11] or '' }}">
            </div>
            <div class="form-group">
                <label for="certificado_aptitud_fisica">Certificado de Aptitud Física</label>
                <input type="text" class="form-control" id="certificado_aptitud_fisica" name="certificado_aptitud_fisica" value="{{ profesor[12] or '' }}">
            </div>
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="activo" name="activo" {% if profesor[13] %}checked{% endif %}>
                <label class="form-check-label" for="activo">Activo</label>
            </div>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="{{ url_for('profesores') }}" class="btn btn-secondary">Volver</a>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
